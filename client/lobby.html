<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Arena Multijugador</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body class="lobby-page">
    <h1 data-text="SALA DE JUEGO">SALA DE JUEGO</h1>
    <div class="status">
        🎮 Conectado como: <strong id="currentUser">---</strong><br>
        🔗 Coordinador: <strong id="coordinatorId">---</strong> |
        ⚡ Tick rate: <span id="tickRate">---</span> Hz
    </div>
    <div class="game-wrapper">
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="collectFeed" class="collect-feed"></div>
    </div>
    <p class="game-hint">🕹️ Usa <kbd>WASD</kbd> o <kbd>↑←↓→</kbd> para moverte · Recoge los orbes para sumar puntos</p>
    <div class="controls">
        <label class="color-picker-label" for="playerColor">🎨 Color del jugador</label>
        <input id="playerColor" class="color-picker" type="color" value="#ff5500" />
        <button id="logoutBtn" class="logout-btn">🚪 CERRAR SESIÓN</button>
    </div>
    <div class="particles" id="particles"></div>

    <!-- Modal de desconexión (se muestra cuando falla la reconexión) -->
    <div id="disconnectModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Conexión Perdida</h3>
            <p>Se ha perdido la conexión con el servidor.</p>
            <button id="modalOkBtn" class="modal-btn">Volver al Login</button>
        </div>
    </div>

    <script src="js/particles.js"></script>
    <script type="module" src="js/lobby.js"></script>
</body>
</html>
